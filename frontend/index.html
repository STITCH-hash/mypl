<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text2SQL 智能问答系统</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <h1>Text2SQL 智能问答系统</h1>
        <p>课程项目最小页面骨架，当前使用来自 <code>tests/text2sql_cases.json</code> 的 mock 接口验证流程。</p>
      </header>

      <section class="workspace">
        <section class="panel question-panel">
          <h2>问答输入区</h2>
          <textarea id="questionInput" rows="5" placeholder="请输入问题...">最近一个交易日成交量最高的10支股票是什么？</textarea>
          <button id="submitButton" type="button">提交问题</button>
        </section>

        <section class="panel">
          <h2>SQL 展示区</h2>
          <pre id="sqlOutput">等待生成 SQL...</pre>
        </section>

        <section class="panel result-panel">
          <h2>查询结果展示区</h2>
          <div id="summaryOutput" class="summary">等待查询结果...</div>
          <div id="chartContainer" style="width:100%; height:350px; margin: 16px 0;"></div>
          <div id="tableOutput" class="table-wrapper"></div>
        </section>

        <section class="panel status-panel">
          <h2>系统状态 / 测试结果</h2>
          <ul id="statusList">
            <li>后端接口：待检测</li>
            <li>SQL 安全校验：mock 已启用</li>
            <li>测试用例：见 tests/text2sql_cases.json</li>
          </ul>
        </section>
      </section>
    </main>
    <script src="./app.js"></script>
    <div style="margin-top: 24px; padding: 12px 0; border-top: 1px solid #d9e2ec; text-align: center;">
      <p style="color: #94a3b8; font-size: 14px; margin: 0;">股票数据仅用于课程演示，不构成投资建议。</p>
    </div>
  </body>
</html>
